---
# SPDX-License-Identifier: MIT
argument_specs:
  main:
    options:
      centos_dhcpd_domain_name:
        type: str
        required: true
        description: Local domain name that the role gives to DHCP clients.
      centos_dhcpd_domain_dns_servers:
        type: list
        elements: str
        required: true
        description: DNS server addresses that the role gives to DHCP clients.
      centos_dhcpd_default_lease_time:
        type: int
        required: true
        description: Lease time in seconds for a new lease.
      centos_dhcpd_max_lease_time:
        type: int
        required: true
        description: Maximum lease time in seconds.
      centos_dhcpd_subnet_ip_address:
        type: str
        required: true
        description: Network address of the served subnet.
      centos_dhcpd_netmask_ip_address:
        type: str
        required: true
        description: Netmask of the served subnet.
      centos_dhcpd_dynamic_ip_range:
        type: list
        elements: str
        required: true
        description: Start and end address of the dynamic IP range.
      centos_dhcpd_gateway_ip_address:
        type: str
        required: true
        description: Gateway address that the role gives to DHCP clients.
      centos_dhcpd_broadcast_ip_address:
        type: str
        required: true
        description: Broadcast address that the role gives to DHCP clients.
      centos_dhcpd_pxelinux_filename:
        type: str
        default: pxelinux.0
        description: Boot file name that PXE clients download.
      centos_dhcpd_next_server:
        type: str
        default: ""
        description: >-
          TFTP server address for PXE clients. An empty value uses
          the primary IPv4 address of the DHCP server host.
      centos_dhcpd_authoritative:
        type: bool
        default: true
        description: Answer all DHCP traffic on the network.
      centos_dhcpd_log_facility:
        type: str
        default: local7
        description: Syslog facility for ISC dhcpd. Use with ISC dhcpd only.
      centos_dhcpd_interfaces:
        type: list
        elements: str
        default:
          - "*"
        description: Network interfaces for Kea DHCP. Use with Kea DHCP only.
      centos_dhcpd_pools:
        type: list
        elements: dict
        description: >-
          Static IP pools for PXE clients. Each pool matches clients
          by a MAC address prefix or a hostname prefix.
        default:
          - name: VBox
            match_by: mac
            match_value: "08:00:27"
            range: ["192.168.1.40", "192.168.1.41"]
            next_server: ""
          - name: SuperMicro
            match_by: mac
            match_value: "00:25:90"
            range: ["192.168.1.42", "192.168.1.43"]
            next_server: ""
          - name: pxe
            match_by: hostname
            match_value: "pxe"
            range: ["192.168.1.44", "192.168.1.45"]
            next_server: ""
        options:
          name:
            type: str
            required: true
            description: Class name of this pool.
          match_by:
            type: str
            required: true
            choices:
              - mac
              - hostname
            description: Match clients by a MAC address prefix or a hostname prefix.
          match_value:
            type: str
            required: true
            description: >-
              MAC address prefix such as 08:00:27, or hostname prefix
              such as pxe. Use lowercase hexadecimal.
          range:
            type: list
            elements: str
            required: true
            description: Start and end address of the pool range.
          next_server:
            type: str
            default: ""
            description: >-
              TFTP server address for this pool. An empty value uses
              the centos_dhcpd_next_server value.
