---
# SPDX-License-Identifier: MIT

- name: Assert supported platform
  ansible.builtin.assert:
    that: centos_dhcpd_supported | bool
    fail_msg: >-
      {{ ansible_facts['distribution'] }}
      {{ ansible_facts['distribution_major_version'] }} is not supported.
      Supported: EL 9 (ISC dhcpd), EL 10 (Kea), Fedora 42 (Kea),
      Fedora 43-45 (ISC dhcpd).

- name: Install DHCP server package
  ansible.builtin.package:
    name: "{{ centos_dhcpd_package }}"
    state: present

- name: Render ISC dhcpd configuration
  ansible.builtin.template:
    src: dhcpd.conf.j2
    dest: /etc/dhcp/dhcpd.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
    validate: dhcpd -t -cf %s
  when: centos_dhcpd_backend == 'isc'
  notify: Restart dhcpd

- name: Render Kea DHCP configuration
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: kea
    mode: "0640"
    backup: true
    validate: kea-dhcp4 -t %s
  when: centos_dhcpd_backend == 'kea'
  notify: Restart kea-dhcp4

- name: Enable DHCP server service
  ansible.builtin.service:
    name: "{{ centos_dhcpd_service }}"
    enabled: true
